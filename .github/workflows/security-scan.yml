name: Firebolt Security Scan

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions: {}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # Sonar reads PR information.
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Security Scan"
        uses: firebolt-db/action-security-scan@83d65487985b5e0e967362900c665ced1e8d0dbf # main
        with:
          github-key: ${{ secrets.GITHUB_TOKEN }}
          fossa-key: ${{ secrets.FOSSA_TOKEN }}
          sonar-key: ${{ secrets.SONARCLOUD_TOKEN }}
